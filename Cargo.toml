[package]
name = "mengervibes"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
wgpu = "24"
winit = "0.30"
pollster = "0.4"
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"
semver = "1"
image = { version = "0.25", default-features = false, features = ["hdr", "png"] }
half = "2.7"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
naga = { version = "24", features = ["wgsl-in"] }
